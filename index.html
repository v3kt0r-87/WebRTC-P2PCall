<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AUDIO-LINK // OPTIMIZED</title>

<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

<style>
:root {
    --neon-green: #00ff41;
    --neon-cyan: #00f3ff;
    --bg-black: #010103;
}

/* Base Terminal Style */
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Courier New', Courier, monospace; }

body {
    min-height: 100vh;
    background-color: var(--bg-black);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--neon-green);
    overflow: hidden;
}

/* Low-CPU Background */
#bg-canvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    opacity: 0.6;
}

/* CSS Grid Overlay (Zero CPU Cost) */
body::after {
    content: "";
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background-image: linear-gradient(rgba(0, 255, 65, 0.05) 1px, transparent 1px),
                      linear-gradient(90deg, rgba(0, 255, 65, 0.05) 1px, transparent 1px);
    background-size: 30px 30px;
    z-index: -1;
    pointer-events: none;
}

.terminal {
    width: 100%;
    max-width: 500px;
    background: rgba(0, 5, 2, 0.95);
    border: 1px solid var(--neon-green);
    padding: 30px;
    position: relative;
    box-shadow: 0 0 30px rgba(0, 255, 65, 0.1);
}

.header h1 {
    font-size: 28px;
    text-transform: uppercase;
    letter-spacing: 5px;
    text-align: center;
    color: #fff;
    margin-bottom: 20px;
}

.label { 
    font-size: 14px;
    margin-bottom: 8px; 
    display: block; 
    color: var(--neon-cyan); 
    opacity: 0.8; 
    font-weight: bold;
}

input {
    width: 100%;
    background: rgba(0, 255, 65, 0.05);
    border: 1px solid var(--neon-green);
    padding: 14px;
    color: var(--neon-green);
    outline: none;
    margin-bottom: 12px;
    font-size: 18px;
}

button {
    width: 100%;
    padding: 16px;
    background: transparent;
    border: 1px solid var(--neon-green);
    color: var(--neon-green);
    font-weight: bold;
    font-size: 16px;
    cursor: pointer;
    text-transform: uppercase;
    transition: 0.2s ease;
}

button:hover { background: var(--neon-green); color: var(--bg-black); }

/* Layout Adjustments */
.id-display-box {
    margin-bottom: 25px;
    border-bottom: 1px solid rgba(0, 255, 65, 0.2);
    padding-bottom: 15px;
}

.copy-btn {
    font-size: 14px;
    padding: 8px;
    margin-top: 5px;
    border-style: dashed;
    opacity: 0.8;
}

/* Call Stage */
#call-stage { display: none; }

.avatar-grid {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin: 25px 0;
}

.avatar-wrap {
    text-align: center;
    border: 1px solid var(--neon-green);
    padding: 5px;
    background: #000;
}

.avatar {
    width: 110px;
    height: 110px;
    display: block;
}

.user-label {
    font-size: 14px;
    background: var(--neon-green);
    color: #000;
    display: block;
    padding: 4px 0;
    text-transform: uppercase;
    font-weight: bold;
}

.viz-box {
    height: 50px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    margin-bottom: 25px;
    border: 1px solid rgba(0, 255, 65, 0.2);
}

.bar { width: 5px; height: 100%; background: var(--neon-green); transform: scaleY(0.1); }

.stats-container {
    display: flex;
    gap: 15px;
    margin-bottom: 20px;
}

.stat-item {
    flex: 1;
    border: 1px solid var(--neon-cyan);
    padding: 8px;
    text-align: center;
    font-size: 14px;
    font-weight: bold;
}

.end-btn { border-color: #ff0055; color: #ff0055; }
.end-btn:hover { background: #ff0055; color: #fff; }

</style>
</head>
<body>

<canvas id="bg-canvas"></canvas>

<div class="terminal">
    <div class="header"><h1>AUDIO LINK</h1></div>

    <!-- Initialization -->
    <div id="setup-phase">
        <span class="label">IDENTITY_REGISTRATION:</span>
        <input type="text" id="username-input" placeholder="USER_ID">
        
        <!-- Setup Error message container -->
        <div id="setup-error" style="color: #00f3ff; font-size: 14px; margin-bottom: 12px; display: none; font-weight: bold;"></div>
        
        <button onclick="initializePeer()">SYNC_UPLINK</button>
    </div>

    <!-- Lobby / Main Menu -->
    <div id="call-controls" style="display: none;">
        <div class="id-display-box">
            <span class="label">YOUR_CURRENT_ID:</span>
            <div id="my-id" style="font-size: 24px; font-weight: bold; margin: 10px 0; color: #fff;">---</div>
            <button class="copy-btn" onclick="copyID()">> COPY_ID_TO_BUFFER</button>
        </div>

        <span class="label">REMOTE_CONNECTION_ID:</span>
        <input type="text" id="peer-id" placeholder="TARGET_ID">
        
        <!-- Call Target Error message container -->
        <div id="call-error" style="color: #00f3ff; font-size: 14px; margin-bottom: 12px; display: none; font-weight: bold;"></div>

        <button onclick="startCall()">INITIATE_HANDSHAKE</button>
    </div>

    <!-- Call Active Interface -->
    <div id="call-stage">
        <div class="stats-container">
            <div class="stat-item">RTT: <span id="stat-latency">--</span></div>
            <div class="stat-item">LOSS: <span id="stat-loss">0</span></div>
        </div>

        <div class="avatar-grid">
            <div class="avatar-wrap">
                <span class="user-label" id="local-user-tag">LOCAL</span>
                <img id="my-avatar" class="avatar">
            </div>
            <div style="color: var(--neon-cyan); animation: pulse 1s infinite; font-size: 24px;">>></div>
            <div class="avatar-wrap">
                <span class="user-label" id="remote-user-tag">REMOTE</span>
                <img id="peer-avatar" class="avatar">
            </div>
        </div>

        <div class="viz-box" id="visualizer"></div>
        <button class="end-btn" onclick="endCall()">TERMINATE_LINK</button>
    </div>
</div>

<audio id="remote-audio" autoplay></audio>

<script>
let peer = null, localStream = null, currentCall = null;
let audioCtx = null, animationId = null, statsInterval = null;

// OPTIMIZED AUDIO CONSTRAINTS
const audioConstraints = { 
    audio: { 
        echoCancellation: false, // Disabled to save CPU. Wear headphones!
        noiseSuppression: false, 
        autoGainControl: false, // Prevents volume ducking delays
        sampleRate: 48000,
        channelCount: 1
    } 
};

// OPTIMIZED MATRIX: Lowered density and framerate
const canvas = document.getElementById('bg-canvas');
const ctx = canvas.getContext('2d');
let w = canvas.width = window.innerWidth;
let h = canvas.height = window.innerHeight;
const cols = Math.floor(w / 25);
const drops = Array(cols).fill(1);

function matrix() {
    ctx.fillStyle = 'rgba(1, 1, 3, 0.1)';
    ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = '#00ff41';
    ctx.font = '16px monospace';
    for (let i = 0; i < drops.length; i++) {
        const text = Math.floor(Math.random() * 2); 
        ctx.fillText(text, i * 25, drops[i] * 16);
        if (drops[i] * 16 > h && Math.random() > 0.98) drops[i] = 0;
        drops[i]++;
    }
}
setInterval(matrix, 50);

// Visualizer setup
const vizContainer = document.getElementById('visualizer');
for(let i=0; i<16; i++) {
    const bar = document.createElement('div');
    bar.className = 'bar';
    vizContainer.appendChild(bar);
}

function initializePeer() {
    const user = document.getElementById('username-input').value.trim();
    const errorBox = document.getElementById('setup-error');

    // Validation Check for Initial Setup
    if (user.length < 4) {
        errorBox.innerText = "ERR_AUTH: USER_ID MUST BE AT LEAST 4 CHARACTERS";
        errorBox.style.display = "block";
        return; 
    }
    
    errorBox.style.display = "none";

    // Initialize with direct STUN servers to fix latency
    peer = new Peer(user, {
        config: {
            'iceServers': [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' }
            ]
        }
    });

    peer.on('open', (id) => {
        document.getElementById('my-id').innerText = id;
        document.getElementById('local-user-tag').innerText = id.substring(0,8);
        document.getElementById('setup-phase').style.display = 'none';
        document.getElementById('call-controls').style.display = 'block';
        document.getElementById('my-avatar').src = `https://api.dicebear.com/7.x/identicon/svg?seed=${id}&backgroundColor=000000`;
    });

    peer.on('call', async (call) => {
        if(confirm(`ACCEPT UPLINK FROM ${call.peer}?`)) {
            try {
                localStream = await navigator.mediaDevices.getUserMedia(audioConstraints);
                call.answer(localStream);
                handleCall(call);
            } catch(e) {
                alert("ERR_SYS: MICROPHONE UPLINK FAILED / DENIED");
            }
        }
    });

    peer.on('error', (err) => alert("CONNECTION_FAULT: " + err.type));
}

async function startCall() {
    const target = document.getElementById('peer-id').value.trim();
    const errorBox = document.getElementById('call-error');

    // Validation Check for Target ID
    if (target.length < 4) {
        errorBox.innerText = "ERR_TARGET: TARGET_ID MUST BE AT LEAST 4 CHARACTERS";
        errorBox.style.display = "block";
        return;
    }

    // Prevent connecting to yourself
    if (target === peer.id) {
        errorBox.innerText = "ERR_TARGET: CANNOT INITIATE HANDSHAKE WITH LOCAL_ID";
        errorBox.style.display = "block";
        return;
    }

    errorBox.style.display = "none";

    try {
        localStream = await navigator.mediaDevices.getUserMedia(audioConstraints);
        currentCall = peer.call(target, localStream);
        handleCall(currentCall);
    } catch (e) {
        errorBox.innerText = "ERR_SYS: MICROPHONE UPLINK FAILED / DENIED";
        errorBox.style.display = "block";
    }
}

function handleCall(call) {
    currentCall = call;
    document.getElementById('call-controls').style.display = 'none';
    document.getElementById('call-stage').style.display = 'block';
    document.getElementById('remote-user-tag').innerText = call.peer.substring(0,8);
    document.getElementById('peer-avatar').src = `https://api.dicebear.com/7.x/identicon/svg?seed=${call.peer}&backgroundColor=000000`;

    setupVisualizer(localStream);
    call.on('stream', s => {
        document.getElementById('remote-audio').srcObject = s;
        startStats(call.peerConnection);
    });
    call.on('close', cleanup);
}

// GPU-Accelerated Visualizer (Capped at 30 FPS)
function setupVisualizer(stream) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const source = audioCtx.createMediaStreamSource(stream);
    const analyser = audioCtx.createAnalyser();
    analyser.fftSize = 32; 
    source.connect(analyser);
    const data = new Uint8Array(analyser.frequencyBinCount);
    const bars = document.querySelectorAll('.bar');

    // Make sure bars scale upwards
    bars.forEach(bar => bar.style.transformOrigin = "bottom");

    function draw() {
        // Cap at ~30 FPS to save CPU (1000ms / 30 frames)
        animationId = setTimeout(draw, 33);
        
        analyser.getByteFrequencyData(data);
        bars.forEach((bar, i) => {
            // Hardware-accelerated CSS transform instead of CPU-heavy height changes
            const scaleY = Math.max(0.05, data[i] / 255);
            bar.style.transform = `scaleY(${scaleY})`; 
        });
    }
    draw();
}

function startStats(pc) {
    statsInterval = setInterval(async () => {
        const stats = await pc.getStats();
        stats.forEach(r => {
            if (r.type === 'remote-inbound-rtp') {
                document.getElementById('stat-latency').innerText = Math.round(r.roundTripTime * 1000) + 'ms';
                document.getElementById('stat-loss').innerText = r.packetsLost || 0;
            }
        });
    }, 2000);
}

function endCall() {
    if(currentCall) currentCall.close();
    cleanup();
}

function cleanup() {
    if(localStream) localStream.getTracks().forEach(t => t.stop());
    if(animationId) clearTimeout(animationId); // Clear the 30fps timeout
    if(audioCtx) audioCtx.close();
    if(statsInterval) clearInterval(statsInterval);
    document.getElementById('call-stage').style.display = 'none';
    document.getElementById('call-controls').style.display = 'block';
}

function copyID() {
    navigator.clipboard.writeText(document.getElementById('my-id').innerText);
}

window.addEventListener('resize', () => {
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
});
</script>

<style>
@keyframes pulse { 50% { opacity: 0.2; } }
</style>

</body>
</html>
