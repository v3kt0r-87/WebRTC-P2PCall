<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AUDIO LINK</title>

<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

<style>

/* MODERN THEME VARIABLES */
:root{
    --bg-base: #020205;
    --surface: rgba(10, 12, 16, 0.65);
    --surface-hover: rgba(0, 255, 65, 0.08);
    --border: rgba(0, 255, 65, 0.3);
    --border-highlight: rgba(0, 243, 255, 0.6);
    --primary: #00ff41;
    --primary-glow: rgba(0, 255, 65, 0.4);
    --secondary: #00f3ff;
    --danger: #ff0055;
    --text-main: #f0fdf4;
    --text-muted: #86a58d;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace;
}

body{
    background-color: var(--bg-base);
    color: var(--text-main);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

#bg-canvas{
    position: fixed;
    inset: 0;
    z-index: -1;
    mix-blend-mode: screen; 
    opacity: 0.85;
}

/* Modern Glassmorphism Terminal */
.terminal{
    width: 100%;
    max-width: 720px;
    background: var(--surface);
    backdrop-filter: blur(12px); 
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 32px;
    box-shadow: 
        0 25px 50px -12px rgba(0,0,0,0.7),
        0 0 0 1px rgba(255,255,255,0.05) inset,
        0 0 30px var(--primary-glow);
    position: relative;
    z-index: 1;
    transform: translateY(0);
    transition: all 0.3s ease;
}

.header{
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
    padding-bottom: 16px;
    border-bottom: 1px solid rgba(255,255,255,0.05);
}

.header h1{
    color: var(--text-main);
    font-size: 20px;
    letter-spacing: 6px;
    font-weight: 600;
    text-transform: uppercase;
    text-shadow: 0 0 10px var(--primary-glow);
}

.status-dot {
    width: 8px;
    height: 8px;
    background: var(--primary);
    border-radius: 50%;
    box-shadow: 0 0 10px var(--primary);
    animation: pulse-dot 2s infinite;
}

.label{
    display: block;
    color: var(--text-muted);
    margin-bottom: 8px;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1px;
}

input[type="text"], button{
    width: 100%;
    border-radius: 8px;
    transition: all 0.2s ease;
}

input[type="text"]{
    background: rgba(0,0,0,0.4);
    border: 1px solid var(--border);
    padding: 16px;
    color: var(--primary);
    margin-bottom: 16px;
    outline: none;
    font-size: 16px;
    box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
}

input[type="text"]:focus{
    border-color: var(--secondary);
    box-shadow: inset 0 2px 4px rgba(0,0,0,0.5), 0 0 15px rgba(0, 243, 255, 0.2);
}

input[type="text"]::placeholder {
    color: rgba(0, 255, 65, 0.2);
}

button{
    background: rgba(0, 255, 65, 0.05);
    border: 1px solid var(--primary);
    color: var(--primary);
    padding: 16px;
    cursor: pointer;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
}

button:hover{
    background: var(--primary);
    color: #000;
    box-shadow: 0 0 20px var(--primary-glow);
    transform: translateY(-2px);
}

.copy-btn{
    border: 1px dashed var(--text-muted);
    color: var(--text-muted);
    background: transparent;
    padding: 10px;
    font-size: 13px;
    margin-top: 12px;
}

.copy-btn:hover{
    border-style: solid;
    border-color: var(--secondary);
    background: var(--secondary);
}

#call-stage{
    display: none;
}

.data-grid{
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 16px;
    margin-bottom: 24px;
}

.data-card{
    background: rgba(0,0,0,0.3);
    border: 1px solid rgba(255,255,255,0.05);
    border-radius: 12px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.data-row {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
}

.data-value {
    color: var(--secondary);
    font-weight: bold;
}

.avatar-grid{
    display: flex;
    justify-content: space-around;
    align-items: flex-start;
    margin: 32px 0;
    padding: 20px;
    background: rgba(0,0,0,0.2);
    border-radius: 16px;
    border: 1px solid rgba(255,255,255,0.03);
}

.avatar-wrap{
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    max-width: 140px;
}

.avatar{
    width: 90px;
    height: 90px;
    border-radius: 50%;
    border: 2px solid var(--border);
    padding: 4px;
    background: #000;
    box-shadow: 0 0 20px rgba(0,0,0,0.5);
    transition: transform 0.3s ease;
}

.user-tag{
    background: rgba(0, 255, 65, 0.1);
    color: var(--primary);
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: bold;
    border: 1px solid var(--border);
}

.ip-display {
    font-size: 11px;
    color: var(--text-muted);
    text-align: center;
    word-break: break-all;
    line-height: 1.4;
}

.center-module {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    margin-top: 15px; 
}

.call-timer {
    font-size: 14px;
    font-weight: bold;
    color: var(--primary);
    letter-spacing: 2px;
    text-shadow: 0 0 10px var(--primary-glow);
}

.connection-line {
    display: flex;
    align-items: center;
    gap: 8px;
}

.dot {
    width: 6px;
    height: 6px;
    background: var(--secondary);
    border-radius: 50%;
    animation: transfer 1s linear infinite;
}

/* OPTIMIZED CANVAS VISUALIZER CONTAINER */
.viz-box{
    height: 80px;
    width: 100%;
    border: 1px solid rgba(255,255,255,0.05);
    border-radius: 12px;
    background: rgba(0,0,0,0.4);
    margin-bottom: 24px;
    position: relative;
    overflow: hidden;
    box-shadow: inset 0 5px 20px rgba(0,0,0,0.5);
}

#viz-canvas {
    width: 100%;
    height: 100%;
    display: block;
}

.controls-row {
    display: flex;
    align-items: center;
    gap: 20px;
    margin-bottom: 16px;
    background: rgba(0,0,0,0.2);
    padding: 16px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.03);
}

.range{
    flex: 1;
    -webkit-appearance: none;
    background: rgba(255,255,255,0.1);
    height: 4px;
    border-radius: 2px;
    outline: none;
}

.range::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--primary);
    cursor: pointer;
    box-shadow: 0 0 10px var(--primary);
}

/* CUSTOM HARDWARE TOGGLES */
.toggle-group {
    display: flex;
    justify-content: space-around;
    align-items: center;
    margin-bottom: 24px;
    background: rgba(0,0,0,0.2);
    padding: 12px 16px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.03);
}

.toggle-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
}

.toggle-switch {
    position: relative;
    display: inline-block;
    width: 44px;
    height: 22px;
}

.toggle-switch input {
    opacity: 0;
    width: 0;
    height: 0;
}

.toggle-slider {
    position: absolute;
    cursor: pointer;
    top: 0; left: 0; right: 0; bottom: 0;
    background-color: rgba(255,255,255,0.1);
    transition: .3s;
    border-radius: 22px;
    border: 1px solid var(--border);
}

.toggle-slider:before {
    position: absolute;
    content: "";
    height: 14px;
    width: 14px;
    left: 3px;
    bottom: 3px;
    background-color: var(--text-muted);
    transition: .3s;
    border-radius: 50%;
}

input:checked + .toggle-slider {
    background-color: rgba(0, 255, 65, 0.1);
    border-color: var(--primary);
}

input:checked + .toggle-slider:before {
    transform: translateX(22px);
    background-color: var(--primary);
    box-shadow: 0 0 10px var(--primary-glow);
}

.end-btn{
    background: transparent;
    border-color: var(--danger);
    color: var(--danger);
}

.end-btn:hover{
    background: var(--danger);
    color: #fff;
    box-shadow: 0 0 20px rgba(255, 0, 85, 0.4);
}

@keyframes pulse-dot{
    0%, 100% { opacity: 1; box-shadow: 0 0 10px var(--primary); }
    50% { opacity: 0.3; box-shadow: 0 0 2px var(--primary); }
}

@keyframes transfer{
    0% { transform: translateX(-10px); opacity: 0; }
    50% { opacity: 1; }
    100% { transform: translateX(10px); opacity: 0; }
}

</style>
</head>

<body>

<canvas id="bg-canvas"></canvas>

<div class="terminal">
    <div class="header">
        <h1>AUDIO LINK</h1>
        <div class="status-dot" id="system-status"></div>
    </div>

    <!-- SETUP -->
    <div id="setup-phase">
        <span class="label">Identity Registration</span>
        <input type="text" id="username-input" placeholder="Enter System ID" autocomplete="off" spellcheck="false">
        <div id="setup-error" style="display:none;color:var(--danger);margin-bottom:16px;font-size:14px;"></div>
        <button onclick="initializePeer()">Initialize Uplink</button>
    </div>

    <!-- LOBBY -->
    <div id="call-controls" style="display:none;">
        <div class="data-card" style="margin-bottom: 24px;">
            <span class="label">Local Node Address</span>
            <div id="my-id" style="font-size:24px;color:var(--text-main);font-weight:bold;letter-spacing:2px;">---</div>
            <button class="copy-btn" onclick="copyID()">Copy to Clipboard</button>
        </div>

        <span class="label">Target Node Address</span>
        <input type="text" id="peer-id" placeholder="Paste Target ID" autocomplete="off" spellcheck="false">
        <div id="call-error" style="display:none;color:var(--danger);margin-bottom:16px;font-size:14px;"></div>
        <button onclick="startCall()">Establish Connection</button>
    </div>

    <!-- CALL ACTIVE -->
    <div id="call-stage">
        
        <div class="data-grid">
            <div class="data-card">
                <span class="label" style="margin-bottom: 4px;">Telemetry</span>
                <div class="data-row"><span>Ping (Avg)</span> <span class="data-value" id="lat-avg">--</span></div>
                <div class="data-row"><span>Jitter</span> <span class="data-value" id="jitter">--</span></div>
                <div class="data-row"><span>Loss</span> <span class="data-value" id="loss">0</span></div>
                <div class="data-row"><span>Integrity</span> <span class="data-value" id="quality">--</span></div>
            </div>
            <div class="data-card">
                <span class="label" style="margin-bottom: 4px;">Routing Info</span>
                <div class="data-row"><span>Type</span> <span class="data-value" id="network-type">---</span></div>
                <div class="data-row"><span>Route</span> <span class="data-value" id="transport" style="font-size:11px;">---</span></div>
            </div>
        </div>

        <div class="avatar-grid">
            <!-- Left Side: Local -->
            <div class="avatar-wrap">
                <img id="my-avatar" class="avatar">
                <span class="user-tag" id="local-user-tag">LOCAL</span>
                <span class="ip-display" id="local-ip">---</span>
            </div>
            
            <!-- Center Module (Timer & Connection Line) -->
            <div class="center-module">
                <div id="call-timer" class="call-timer">00:00</div>
                <div class="connection-line">
                    <div class="dot" style="animation-delay: 0s;"></div>
                    <div class="dot" style="animation-delay: 0.3s;"></div>
                    <div class="dot" style="animation-delay: 0.6s;"></div>
                </div>
            </div>

            <!-- Right Side: Remote -->
            <div class="avatar-wrap">
                <img id="peer-avatar" class="avatar">
                <span class="user-tag" id="remote-user-tag" style="border-color:var(--secondary); color:var(--secondary); background:rgba(0,243,255,0.1);">TARGET</span>
                <span class="ip-display" id="remote-ip">---</span>
            </div>
        </div>

        <span class="label">MICROPHONE INTENSITY</span>
        <div class="viz-box">
            <canvas id="viz-canvas"></canvas>
        </div>

        <!-- Volume Controller -->
        <div class="controls-row">
            <span class="label" style="margin:0; min-width: 110px;">Volume Gain: <span id="gain-value" style="color:var(--primary);">1.0x</span></span>
            <input type="range" id="gain-slider" class="range" min="50" max="300" value="100">
            <span class="label" style="margin:0; min-width: 60px; text-align:right;" id="db-level">-- dB</span>
        </div>

        <!-- Real-Time Hardware Audio Processing Toggles -->
        <div class="toggle-group">
            <div class="toggle-item">
                <span class="label" style="margin:0; font-size:10px;">NOISE SUPPRESS</span>
                <label class="toggle-switch">
                    <input type="checkbox" id="toggle-ns" checked onchange="updateAudioConstraints()">
                    <span class="toggle-slider"></span>
                </label>
            </div>
            <div class="toggle-item">
                <span class="label" style="margin:0; font-size:10px;">ECHO CANCEL</span>
                <label class="toggle-switch">
                    <input type="checkbox" id="toggle-ec" checked onchange="updateAudioConstraints()">
                    <span class="toggle-slider"></span>
                </label>
            </div>
        </div>

        <button class="end-btn" onclick="endCall()">TERMINATE CONNECTION</button>
    </div>
</div>

<audio id="remote-audio" autoplay></audio>

<script>

/* GLOBALS */
let peer = null;
let localStream = null;
let currentCall = null;
let remoteAudioCtx = null; 
let localAudioCtx = null;
let gainNode = null;
let compressor = null;
let remoteSource = null;
let statsInterval = null;
let latencyHistory = [];
let vizAnimationId = null; 
let callTimerInterval = null;
let callStartTime = 0;

// Centralized Audio Config
const audioConstraints = {
    audio: {
        echoCancellation: true,
        noiseSuppression: true,
        autoGainControl: false,
        sampleRate: 48000,
        channelCount: 1,
        latency: 0.02
    }
};

/* --- SMOOTH CLASSIC MATRIX BACKGROUND --- */
const canvas = document.getElementById('bg-canvas');
const ctx = canvas.getContext('2d');
let w = canvas.width = window.innerWidth;
let h = canvas.height = window.innerHeight;

const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%^&*()ｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎﾏﾐﾑﾒﾓﾔﾕﾖﾗﾘﾙﾚﾛﾜﾝ'.split('');
const fontSize = 16;
let cols = Math.floor(w / fontSize);
let drops = Array(cols).fill(1);
let lastMatrixTime = 0;

function matrixLoop(time) {
    requestAnimationFrame(matrixLoop);
    
    if (time - lastMatrixTime < 50) return;
    lastMatrixTime = time;

    ctx.fillStyle = 'rgba(2, 2, 5, 0.12)'; 
    ctx.fillRect(0, 0, w, h);

    ctx.font = `500 ${fontSize}px monospace`;
    ctx.fillStyle = '#00ff41'; 
    ctx.shadowBlur = 0;        

    for(let i=0; i<drops.length; i++) {
        const text = chars[Math.floor(Math.random() * chars.length)];
        ctx.fillText(text, i * fontSize, drops[i] * fontSize);

        if(drops[i] * fontSize > h && Math.random() > 0.975){
            drops[i] = 0;
        }
        drops[i]++;
    }
}
requestAnimationFrame(matrixLoop);

/* INIT PEER */
function initializePeer(){
    const user = document.getElementById('username-input').value.trim();
    const errorBox = document.getElementById('setup-error');

    if(user.length < 4){
        errorBox.innerText = "[ERROR] Node ID must exceed 3 characters.";
        errorBox.style.display = "block";
        return;
    }

    errorBox.style.display = "none";
    document.getElementById('system-status').style.background = 'orange';

    peer = new Peer(user, {
        config: {
            iceServers: [
                { urls:'stun:stun.cloudflare.com:3478' },
                { urls:'stun:stun.l.google.com:19302' },
                { urls:'stun:stun1.l.google.com:19302' }
            ]
        }
    });

    peer.on('open', (id)=>{
        document.getElementById('my-id').innerText = id;
        document.getElementById('local-user-tag').innerText = id.substring(0,8);
        document.getElementById('setup-phase').style.display = 'none';
        document.getElementById('call-controls').style.display = 'block';
        
        document.getElementById('my-avatar').src = `https://api.dicebear.com/7.x/bottts/svg?seed=${id}&backgroundColor=000000`;
        document.getElementById('system-status').style.background = 'var(--primary)';
    });

    peer.on('call', async(call)=>{
        try{
            localStream = await navigator.mediaDevices.getUserMedia(audioConstraints);
            call.answer(localStream);
            handleCall(call);
        }catch(e){
            alert("[ERROR] Audio interface access denied.");
        }
    });

    peer.on('error', (err)=>{
        alert("[SYS_ERR] " + err.type);
        document.getElementById('system-status').style.background = 'var(--danger)';
    });
}

/* START CALL */
async function startCall(){
    const target = document.getElementById('peer-id').value.trim();
    const errorBox = document.getElementById('call-error');

    if(target.length < 4){
        errorBox.innerText = "[ERROR] Invalid target coordinates.";
        errorBox.style.display = "block";
        return;
    }

    errorBox.style.display = "none";

    try{
        localStream = await navigator.mediaDevices.getUserMedia(audioConstraints);
        currentCall = peer.call(target, localStream);
        handleCall(currentCall);
    }catch(e){
        errorBox.innerText = "[ERROR] Audio interface initialization failed.";
        errorBox.style.display = "block";
    }
}

/* HANDLE CALL */
function handleCall(call){
    currentCall = call;
    document.getElementById('call-controls').style.display = 'none';
    document.getElementById('call-stage').style.display = 'block';
    
    document.getElementById('remote-user-tag').innerText = call.peer.substring(0,8);
    document.getElementById('peer-avatar').src = `https://api.dicebear.com/7.x/bottts/svg?seed=${call.peer}&backgroundColor=000000`;

    setupVisualizer(localStream);

    call.on('stream', async(stream)=>{
        const remoteAudio = document.getElementById('remote-audio');
        remoteAudio.srcObject = stream;

        if (!remoteAudioCtx) {
            remoteAudioCtx = new(window.AudioContext || window.webkitAudioContext)();
        } else if (remoteAudioCtx.state === 'suspended') {
            remoteAudioCtx.resume();
        }

        if (remoteSource) remoteSource.disconnect();
        if (gainNode) gainNode.disconnect();
        if (compressor) compressor.disconnect();

        remoteSource = remoteAudioCtx.createMediaStreamSource(stream);
        gainNode = remoteAudioCtx.createGain();
        compressor = remoteAudioCtx.createDynamicsCompressor();

        compressor.threshold.value = -18;
        compressor.knee.value = 12;
        compressor.ratio.value = 4;
        compressor.attack.value = 0.003;
        compressor.release.value = 0.25;

        gainNode.gain.value = document.getElementById('gain-slider').value / 100;

        remoteSource.connect(gainNode);
        gainNode.connect(compressor);
        compressor.connect(remoteAudioCtx.destination);

        setupGainSlider();
        startStats(call.peerConnection);
        startCallTimer();
    });

    call.on('close', cleanup);
}

/* REAL-TIME AUDIO PROCESSING (HOT-SWAP) */
async function updateAudioConstraints() {
    const isNoiseSuppressed = document.getElementById('toggle-ns').checked;
    const isEchoCancelled = document.getElementById('toggle-ec').checked;

    // Update global state for future connections
    audioConstraints.audio.noiseSuppression = isNoiseSuppressed;
    audioConstraints.audio.echoCancellation = isEchoCancelled;

    // Apply hot-swap to the active microphone track if a call is ongoing
    if (localStream) {
        const audioTrack = localStream.getAudioTracks()[0];
        if (audioTrack && typeof audioTrack.applyConstraints === 'function') {
            try {
                await audioTrack.applyConstraints({
                    noiseSuppression: isNoiseSuppressed,
                    echoCancellation: isEchoCancelled
                });
            } catch (err) {
                console.error("Hardware constraint update failed:", err);
            }
        }
    }
}

/* TIMER LOGIC */
function startCallTimer() {
    callStartTime = Date.now();
    const timerDisplay = document.getElementById('call-timer');
    timerDisplay.innerText = "00:00";

    if (callTimerInterval) clearInterval(callTimerInterval);

    callTimerInterval = setInterval(() => {
        const elapsed = Date.now() - callStartTime;
        const totalSeconds = Math.floor(elapsed / 1000);
        
        const hours = Math.floor(totalSeconds / 3600);
        const minutes = Math.floor((totalSeconds % 3600) / 60).toString().padStart(2, '0');
        const seconds = (totalSeconds % 60).toString().padStart(2, '0');

        if (hours > 0) {
            timerDisplay.innerText = `${hours.toString().padStart(2, '0')}:${minutes}:${seconds}`;
        } else {
            timerDisplay.innerText = `${minutes}:${seconds}`;
        }
    }, 1000);
}

function stopCallTimer() {
    if (callTimerInterval) clearInterval(callTimerInterval);
    callTimerInterval = null;
    document.getElementById('call-timer').innerText = "00:00";
}

/* GAIN */
function setupGainSlider(){
    const slider = document.getElementById('gain-slider');
    const newSlider = slider.cloneNode(true);
    slider.parentNode.replaceChild(newSlider, slider);

    newSlider.addEventListener('input', ()=>{
        const value = newSlider.value;
        const multiplier = (value / 100).toFixed(1);
        document.getElementById('gain-value').innerText = multiplier + "x";
        if(gainNode){
            gainNode.gain.value = value / 100;
        }
    });
}

/* ENHANCED CANVAS VISUALIZER */
function setupVisualizer(stream){
    const vizCanvas = document.getElementById('viz-canvas');
    const vCtx = vizCanvas.getContext('2d');
    
    vizCanvas.width = vizCanvas.offsetWidth;
    vizCanvas.height = vizCanvas.offsetHeight;

    if (!localAudioCtx) {
        localAudioCtx = new(window.AudioContext || window.webkitAudioContext)();
    } else if (localAudioCtx.state === 'suspended') {
        localAudioCtx.resume();
    }

    const source = localAudioCtx.createMediaStreamSource(stream);
    const analyser = localAudioCtx.createAnalyser();
    
    analyser.fftSize = 128;
    analyser.smoothingTimeConstant = 0.85;
    source.connect(analyser);

    const data = new Uint8Array(analyser.frequencyBinCount);

    function draw(){
        vizAnimationId = requestAnimationFrame(draw);
        analyser.getByteFrequencyData(data);

        vCtx.clearRect(0, 0, vizCanvas.width, vizCanvas.height);
        
        let total = 0;
        const sliceWidth = vizCanvas.width * 1.0 / (data.length / 2); 
        let x = 0;

        vCtx.beginPath();
        vCtx.moveTo(0, vizCanvas.height);

        for(let i = 0; i < data.length / 2; i++){
            total += data[i];
            const v = data[i] / 255.0;
            const y = vizCanvas.height - (v * vizCanvas.height * 0.8);

            if(i === 0) {
                vCtx.moveTo(x, y);
            } else {
                const prevX = x - sliceWidth;
                const prevV = data[i-1] / 255.0;
                const prevY = vizCanvas.height - (prevV * vizCanvas.height * 0.8);
                const cpX = prevX + sliceWidth / 2;
                vCtx.quadraticCurveTo(cpX, prevY, x, y);
            }
            x += sliceWidth;
        }

        vCtx.lineTo(vizCanvas.width, vizCanvas.height);
        vCtx.lineTo(0, vizCanvas.height);
        
        const gradient = vCtx.createLinearGradient(0, 0, 0, vizCanvas.height);
        gradient.addColorStop(0, 'rgba(0, 243, 255, 0.5)'); 
        gradient.addColorStop(1, 'rgba(0, 255, 65, 0.0)');  
        
        vCtx.fillStyle = gradient;
        vCtx.fill();

        vCtx.strokeStyle = '#00f3ff';
        vCtx.lineWidth = 2;
        vCtx.stroke();

        const avg = total / (data.length / 2);
        const db = (20 * Math.log10((avg || 1) / 255)).toFixed(1);
        document.getElementById('db-level').innerText = `${db} dB`;
    }

    draw();
}

/* STATS */
async function startStats(pc){
    if (statsInterval) clearInterval(statsInterval);

    setTimeout(async () => {
        const stats = await pc.getStats();
        extractNetworkInfo(stats);
    }, 2000);

    statsInterval = setInterval(async()=>{
        const stats = await pc.getStats();
        
        stats.forEach(r=>{
            if(r.type === 'remote-inbound-rtp'){
                const rtt = Math.round(r.roundTripTime * 1000);
                latencyHistory.push(rtt);
                if(latencyHistory.length > 30) latencyHistory.shift();

                const avg = Math.round(latencyHistory.reduce((a,b)=>a+b,0) / latencyHistory.length);

                document.getElementById('lat-avg').innerText = avg + 'ms';
                document.getElementById('loss').innerText = r.packetsLost || 0;

                const jitter = r.jitter ? (r.jitter * 1000).toFixed(1) : '--';
                document.getElementById('jitter').innerText = jitter + 'ms';

                updateQuality(avg, r.packetsLost || 0);
            }
        });

        extractNetworkInfo(stats);
    }, 2500);
}

/* QUALITY */
function updateQuality(avg, loss){
    let quality = "OPTIMAL";
    let color = "var(--primary)";

    if(avg > 150 || loss > 10){
        quality = "DEGRADED";
        color = "var(--danger)";
    }
    else if(avg > 80 || loss > 3){
        quality = "ACCEPTABLE";
        color = "orange";
    }
    
    const qEl = document.getElementById('quality');
    qEl.innerText = quality;
    qEl.style.color = color;
}

/* NETWORK INFO */
function extractNetworkInfo(stats){
    let localCandidate = null;
    let remoteCandidate = null;

    stats.forEach(report=>{
        if(report.type === "candidate-pair" && report.state === "succeeded"){
            localCandidate = stats.get(report.localCandidateId);
            remoteCandidate = stats.get(report.remoteCandidateId);
            
            const tps = `${localCandidate.candidateType} > ${remoteCandidate.candidateType}`;
            document.getElementById("transport").innerText = tps.toUpperCase();
        }
    });

    if(localCandidate){
        const localIP = localCandidate.address || localCandidate.ip || "[MASKED]";
        document.getElementById("local-ip").innerText = localIP;

        if(localIP.startsWith("172.") || localIP.startsWith("10.") || localIP.startsWith("192.168") || localIP.startsWith("fd") || localIP.startsWith("fc")){
            document.getElementById("network-type").innerText = "LAN / TUNNEL";
        }
        else if(localIP.includes(":")){
            document.getElementById("network-type").innerText = "IPV6 DIRECT";
        }
        else{
            document.getElementById("network-type").innerText = "WAN PUBLIC";
        }
    }
    
    if(remoteCandidate){
        const remoteIP = remoteCandidate.address || remoteCandidate.ip || "---";
        document.getElementById("remote-ip").innerText = remoteIP;
    }
}

/* END */
function endCall(){
    if(currentCall){
        currentCall.close();
    }
    cleanup();
}

/* CLEANUP */
function cleanup(){
    if(localStream){
        localStream.getTracks().forEach(t=>t.stop());
    }

    if(statsInterval){
        clearInterval(statsInterval);
        statsInterval = null;
    }

    if(vizAnimationId){
        cancelAnimationFrame(vizAnimationId);
        vizAnimationId = null;
    }

    stopCallTimer();

    if (localAudioCtx) {
        localAudioCtx.close();
        localAudioCtx = null;
    }
    if (remoteAudioCtx) {
        remoteAudioCtx.close();
        remoteAudioCtx = null;
    }
    
    const vizCanvas = document.getElementById('viz-canvas');
    const vCtx = vizCanvas.getContext('2d');
    vCtx.clearRect(0, 0, vizCanvas.width, vizCanvas.height);
    document.getElementById('db-level').innerText = '-- dB';
    
    // Clear IPs on cleanup
    document.getElementById('local-ip').innerText = "---";
    document.getElementById('remote-ip').innerText = "---";

    document.getElementById('call-stage').style.display = 'none';
    document.getElementById('call-controls').style.display = 'block';
}

/* COPY */
function copyID(){
    const idText = document.getElementById('my-id').innerText;
    navigator.clipboard.writeText(idText);
    
    const btn = document.querySelector('.copy-btn');
    const originalText = btn.innerText;
    btn.innerText = "COPIED!";
    btn.style.color = "var(--primary)";
    btn.style.borderColor = "var(--primary)";
    
    setTimeout(()=>{
        btn.innerText = originalText;
        btn.style.color = "";
        btn.style.borderColor = "";
    }, 2000);
}

/* RESIZE */
window.addEventListener('resize', ()=>{
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
    
    const newCols = Math.floor(w / fontSize);
    if(newCols > drops.length){
        for(let i = drops.length; i < newCols; i++) drops.push(1);
    } else if (newCols < drops.length) {
        drops.length = newCols; 
    }

    const vizCanvas = document.getElementById('viz-canvas');
    if (vizCanvas) {
        vizCanvas.width = vizCanvas.offsetWidth;
        vizCanvas.height = vizCanvas.offsetHeight;
    }
});
